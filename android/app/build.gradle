plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leglerisaac.chessstudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.leglerisaac.chessstudio'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
}

def buildWebsite = tasks.register('buildWebsite', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'npm', 'run', 'build', '--', '--base=/assets/web/'
}

def copyWebsite = tasks.register('copyWebsite', Copy) {
    dependsOn buildWebsite
    from(rootProject.file('../dist')) { into 'web' }
    into layout.buildDirectory.dir('generated/webAssets')
}

// Passing the task itself tells Gradle every asset consumer about its dependency.
android.sourceSets.main.assets.srcDir(copyWebsite)
