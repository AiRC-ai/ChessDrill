plugins {
    id 'com.android.application'
}

android {
    namespace 'com.leglerisaac.chessstudio'
    compileSdk 36

    defaultConfig {
        applicationId 'com.leglerisaac.chessstudio'
        minSdk 26
        targetSdk 36
        // CI supplies a unique code for every Play upload; local builds keep their stable version.
        versionCode (System.getenv('PLAY_VERSION_CODE') ?: '4').toInteger()
        versionName (System.getenv('PLAY_VERSION_NAME') ?: project.findProperty('appVersionName'))
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
}

def buildWebsite = tasks.register('buildWebsite', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'npm', 'run', 'build', '--', '--base=/assets/web/'
}

abstract class BundleWebsiteAssets extends DefaultTask {
    @InputDirectory
    abstract DirectoryProperty getWebsiteDirectory()

    @OutputDirectory
    abstract DirectoryProperty getAssetsDirectory()

    @TaskAction
    void bundle() {
        project.delete(assetsDirectory.get().asFile)
        project.copy {
            from websiteDirectory.get().asFile
            into assetsDirectory.get().dir('web').asFile
        }
    }
}

def bundleWebsiteAssets = tasks.register('bundleWebsiteAssets', BundleWebsiteAssets) {
    dependsOn buildWebsite
    websiteDirectory.set(rootProject.file('../dist'))
    assetsDirectory.set(layout.buildDirectory.dir('generated/webAssets'))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(bundleWebsiteAssets, { it.assetsDirectory })
    }
}
